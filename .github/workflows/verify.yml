name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure build directories on D
        run: |
          . ./.tools/build-env.ps1
          foreach ($name in @('CARGO_HOME','RUSTUP_HOME','CARGO_TARGET_DIR','GRADLE_USER_HOME','ANDROID_USER_HOME','ANDROID_AVD_HOME','TEMP','TMP','npm_config_cache')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Build and test
        run: ./.tools/verify.ps1 -Online -InstallDependencies
      - name: Build Windows installer in the disposable runner
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/release-2-0-rc1')
        run: |
          ./.tools/build-windows.ps1
          node ./.tools/check-msi-package.cjs
      - name: Check installation, upgrade, downgrade blocking, rollback and reinstall
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/release-2-0-rc1')
        env:
          MOMENT_ALLOW_INSTALLER_QA: '1'
        run: ./.tools/windows-installer-matrix.ps1 -Execute
      - name: Retain installer evidence
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/release-2-0-rc1'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-evidence
          path: |
            .build-cache/windows-installer-matrix/*.json
            .build-cache/windows-installer-matrix/*.log
            .build-cache/windows-installer-evidence/*.json
            .build-cache/verification/summary.json
            .build-cache/verification/*.log
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi
            ${{ env.CARGO_TARGET_DIR }}/release/schedule-app.exe
          if-no-files-found: warn
          retention-days: 14
