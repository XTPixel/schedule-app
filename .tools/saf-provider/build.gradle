// Disposable emulator-only DocumentsProvider; no production app sources.
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.0' }
}
apply plugin: 'com.android.application'
repositories { google(); mavenCentral() }
buildDir = file(System.getenv('MOMENT_SAF_BUILD_DIR'))
android {
    namespace 'com.personal.schedule.safqa'
    compileSdk 36
    defaultConfig {
        applicationId 'com.personal.schedule.safqa'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv('ANDROID_USER_HOME') + '/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}
