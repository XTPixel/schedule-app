[package]
name = "schedule-core"
version = "2.0.0"
edition = "2021"
description = "此刻 MOMENT - 核心业务逻辑（数据模型/存储/候选推荐引擎），不依赖 Tauri"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# Phase 3 脚本钩子：受限 JS 解释器（无文件系统/网络能力，仅用于执行用户钩子脚本）。
boa_engine = "0.19"
